name: Build OnePlus 9 Kernel (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    # 关键修改：强制使用 Ubuntu 20.04
    # 这能完美解决 libncurses5 找不到的问题，也能解决 ld 连接失败的问题
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 在 Ubuntu 20.04 上，这些旧包名可以直接使用，不会报错
    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Download Clang Toolchain
      run: |
        mkdir clang
        cd clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
        echo "PATH=$PWD/bin:$PATH" >> $GITHUB_ENV

    - name: Download AnyKernel3
      run: |
        git clone https://github.com/dev-sm8350/AnyKernel3.git
        rm -rf AnyKernel3/.git

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # 你的配置文件名
        DEFCONFIG=vendor/lahaina-qgki_defconfig

        # 1. 生成配置文件
        make O=out $DEFCONFIG

        # 2. 开始编译
        # LLVM=1 启用 Clang 工具链
        # -j$(nproc) 自动利用所有 CPU 核心
        make -j$(nproc --all) O=out \
             LLVM=1 \
             LLVM_IAS=1 \
             Image dtbo.img

    - name: Package Kernel
      run: |
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../OnePlus9-Docker-Kernel.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus9-Docker-Kernel
        path: OnePlus9-Docker-Kernel.zip
