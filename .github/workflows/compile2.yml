name: Build OnePlus 9 Kernel (Docker)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 拉取你的内核源码
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. 安装编译环境 (Ubuntu 缺少这些很难编译成功)
    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 libncurses-dev

    # 3. 下载编译器 (Proton Clang - 推荐用于骁龙888)
    - name: Download Clang Toolchain
      run: |
        mkdir clang
        cd clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
        echo "PATH=$PWD/bin:$PATH" >> $GITHUB_ENV

    # 4. 下载 AnyKernel3 (用于制作刷机包)
    - name: Download AnyKernel3
      run: |
        git clone https://github.com/dev-sm8350/AnyKernel3.git
        rm -rf AnyKernel3/.git

    # 5. 开始编译 (直接运行 make 命令，不再依赖 compile.sh)
    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # 定义配置文件名 (根据你之前的链接)
        DEFCONFIG=vendor/lahaina-qgki_defconfig

        # 生成配置文件
        make O=out $DEFCONFIG

        # 开始编译 (Image 和 dtbo.img)
        # LLVM=1 启用完整 LLVM 工具链
        make -j$(nproc --all) O=out \
             LLVM=1 \
             LLVM_IAS=1 \
             Image dtbo.img

    # 6. 打包成 ZIP
    - name: Package Kernel
      run: |
        # 复制编译好的文件到 AnyKernel3 文件夹
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        
        # 压缩打包
        cd AnyKernel3
        zip -r9 ../OnePlus9-Docker-Kernel.zip *

    # 7. 上传结果
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus9-Docker-Kernel
        path: OnePlus9-Docker-Kernel.zip
